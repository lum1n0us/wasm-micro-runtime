# Reusable gate shared by every upstream CI workflow. Callers invoke it via
# `uses:` and gate their real jobs on `needs.gate.outputs.run`. Per event:
#   - push: runs only on a fork, so upstream never spends minutes on a plain
#     push; upstream push workflows still run the no-op gate to report status.
#   - pull_request_review (submitted): an approval runs CI once per head SHA,
#     so re-approving the same SHA does not re-run the pipeline. Deduplication
#     looks at prior review-triggered runs only: a prior synchronize run that
#     resolved run=false (every job skipped) must not block it, or heavy CI
#     would never run on the approved SHA.
#   - pull_request (synchronize): run once per head SHA after the PR is
#     approved. A synchronize event on an unapproved relevant PR reports an
#     "awaiting approval" status so required checks are not faked green.
#   - anything else (e.g. workflow_dispatch, schedule): always runs.
# Across both PR events: a head SHA that already has a finished run of this
# pipeline is never run again, whatever that run concluded; the gate reports
# `approved` so the earlier verdict on the required check name is the one that
# stands.
name: gate

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Optional newline-separated path globs. When set, the approval gate
          fires only if the PR touches these paths, instead of the caller's
          own on.push.paths. Use it to run heavy pipelines on approval only
          when their own definition changed.
        type: string
        required: false
        default: ""
    outputs:
      run:
        description: '"true" if downstream jobs should run, else "false".'
        value: ${{ jobs.gate.outputs.run }}
      state:
        description: 'Gate state used to select the stable check name.'
        value: ${{ jobs.gate.outputs.state }}

permissions:
  # `actions: read` lets the dedup query below list this workflow's own runs.
  actions: read
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.g.outputs.run }}
      state: ${{ steps.g.outputs.state }}
    steps:
      # A local composite action needs the repo checked out before it can be
      # referenced; fetch just .github (also carries the path-filter helper).
      # The path-filter helper lives under .github; fetch just that.
      - name: checkout workflow metadata
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pipefail matters: the dedup query below pipes `gh api` into jq, and
          # a silent API failure there must not read as "no prior run".
          set -eo pipefail
          set_run() {
            local run="$1"
            local state="$2"
            local message="$3"
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "state=$state" >> "$GITHUB_OUTPUT"
            echo "::notice title=approval gate::$message"
          }

          # Event Push. Upstream? NO! Forked? Yes!
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.event.repository.fork }}" = "true" ]; then
              set_run true push "running CI for fork push"
            else
              set_run false push "skipping CI for upstream push; approval triggers CI"
            fi
            exit 0
          fi

          # For all other events (workflow_dispatch, schedule, etc.), run
          # directly and let downstream jobs decide as usual.
          if [ "${{ github.event_name }}" != "pull_request_review" ] \
             && [ "${{ github.event_name }}" != "pull_request" ]; then
            set_run true run "running CI for ${{ github.event_name }} event"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request_review" ] \
             && [ "${{ github.event.review.state }}" != "approved" ]; then
            set_run false awaiting "skipping CI because the review is not an approval"
            exit 0
          fi

          # An `approved` pull_request_review event can proceed directly - the
          # event itself is the approval. Only synchronize events need an
          # explicit reviewDecision check.
          #
          # A big assumption that callers will register only synchronize events for pull requests.
          # Otherwise, unexpected behavior may occur.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            decision=$(gh api graphql \
                -f query="query(\$owner:String!, \$repo:String!, \$number:Int!) { repository(owner:\$owner, name:\$repo) { pullRequest(number:\$number) { reviewDecision } } }" \
                -F owner="${{ github.repository_owner }}" \
                -F repo="${{ github.event.repository.name }}" \
                -F number="${{ github.event.pull_request.number }}" \
                --jq '.data.repository.pullRequest.reviewDecision // "REVIEW_REQUIRED"')
            if [ "$decision" != "APPROVED" ]; then
              set_run false awaiting "waiting for approval of this synchronized SHA"
              exit 0
            fi
          fi

          # Restore the path filter pull_request had but pull_request_review
          # lacks: only run when the PR actually touches relevant files.
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' > /tmp/changed_files.txt
          # An explicit `paths` input narrows the filter (e.g. a heavy pipeline
          # that should only run on approval when its own definition changed);
          # otherwise fall back to the caller workflow's own on.push.paths.
          if [ -n "${{ inputs.paths }}" ]; then
            printf '%s\n' "${{ inputs.paths }}" > /tmp/gate_paths.txt
            filter_arg=(--paths-file /tmp/gate_paths.txt)
          else
            filter_arg=(--workflow-ref "${{ github.workflow_ref }}")
          fi
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          if python3 .github/scripts/pr_touches_paths.py \
               "${filter_arg[@]}" \
               --changed-files /tmp/changed_files.txt; then
            touches_paths=true
          else
            touches_paths=false
          fi
          if [ "$touches_paths" != "true" ]; then
            set_run false skipped "skipping CI because the PR does not touch relevant paths"
            exit 0
          fi

          # Run CI at most once per head SHA, counting only prior runs of this
          # pipeline that finished with a verdict:
          #   - synchronize dedups against any prior PR run on the SHA, so an
          #     approval right after the push does not run the pipeline twice.
          #   - an approval dedups against review-triggered runs only: a
          #     synchronize run on an unapproved SHA resolves run=false (every
          #     job skipped) yet still concludes "success", and counting that
          #     would mean heavy CI never runs on the approved SHA.
          # `failure` counts - the code was tested and needs a fix from the
          # author, not another CI round. `null` (queued or in progress) does
          # not: `cancel-in-progress` already keeps a single live run per PR,
          # and counting a run that concurrency is about to cancel would leave
          # the SHA with no CI at all. `cancelled`/`skipped`/`stale` never mean
          # "verified", so they must not suppress a later run.
          #
          # The skip reports `approved`, not `skipped`, so the prior run's
          # verdict on the bare required check name is the one that stands;
          # `skipped` would publish a second, always-green check under it.
          # SC2016: `$wf`, `$self` and `$events` are jq variables.
          # shellcheck disable=SC2016
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            dedup_events='["pull_request","pull_request_review"]'
          else
            dedup_events='["pull_request_review"]'
          fi
          prior=$(gh api \
              "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.event.pull_request.head.sha }}&per_page=100" \
            | jq --arg wf "${{ github.workflow }}" --arg self "${{ github.run_id }}" \
                  --argjson events "$dedup_events" \
                  '[ .workflow_runs[]
                     | select(.name == $wf and (.id | tostring) != $self)
                     | select(.event | IN($events[]))
                     | select(.conclusion | IN("success", "failure", "timed_out"))
                   ] | length')
          if [ "$prior" -gt 0 ]; then
            set_run false approved "skipping CI because ${{ github.event.pull_request.head.sha }} already has a run"
            exit 0
          fi
          set_run true run "running CI for approved relevant PR SHA ${{ github.event.pull_request.head.sha }}"
